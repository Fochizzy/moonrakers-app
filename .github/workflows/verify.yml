name: verify

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Node 24 matches local dev: the .test.ts guards rely on Node's native
      # TypeScript type stripping, which is on by default from 23.6.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same gate as local `npm run verify`: full-tree tsc + all 375+ guards.
      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Lint (focused)
        run: npm run lint
